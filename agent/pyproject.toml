[project]
name = "pulse-agent"
version = "0.1.0"
description = "Pulse agentic RAG service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "qdrant-client>=1.15.2",
    # Embeddings only (text-embedding-3-small) — Anthropic has no embeddings API.
    # Generation goes through langchain-anthropic. See README.
    "openai>=1.60",
    "langgraph>=0.3",
    "langchain-anthropic>=0.3",
    # Only langchain-core is used directly; langfuse.langchain's CallbackHandler imports the
    # `langchain` package itself to branch on its major version, and fails without it.
    "langchain>=1.0",
    "langfuse>=3.0",
    # Imported directly for W3C traceparent extraction; langfuse pulls it in too.
    "opentelemetry-api>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
