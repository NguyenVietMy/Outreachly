spring.application.name=pulse
server.port=8080

# Database configuration - Supabase Direct Connection (RLS enabled)
spring.datasource.url=${SUPABASE_SESSION_POOLER}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database connection settings optimized for Supabase
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=59

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.JacksonJsonFormatMapper




# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=${OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.export.enabled=${OBSERVABILITY_TRACING_ENABLED:false}
management.otlp.tracing.endpoint=${OBSERVABILITY_OTLP_ENDPOINT:}
management.otlp.tracing.headers.Authorization=${OBSERVABILITY_OTLP_AUTHORIZATION:}
management.otlp.metrics.export.enabled=${OBSERVABILITY_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OBSERVABILITY_OTLP_METRICS_URL:}
management.otlp.metrics.export.headers.Authorization=${OBSERVABILITY_OTLP_AUTHORIZATION:}
management.otlp.logging.export.enabled=${OBSERVABILITY_LOGS_ENABLED:false}
management.otlp.logging.export.endpoint=${OBSERVABILITY_OTLP_LOGS_URL:}
management.otlp.logging.export.headers.Authorization=${OBSERVABILITY_OTLP_AUTHORIZATION:}

# Langfuse trace export (additional OTLP target alongside management.otlp.tracing.*)
langfuse.enabled=${LANGFUSE_ENABLED:false}
# LANGFUSE_BASE_URL is the name Langfuse's own UI and CLI hand out; accept both.
langfuse.host=${LANGFUSE_HOST:${LANGFUSE_BASE_URL:}}
langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
langfuse.secret-key=${LANGFUSE_SECRET_KEY:}

# Qdrant vector database. The client is gRPC; QDRANT_URL is the REST URL Qdrant Cloud hands out,
# so QdrantConfig substitutes the gRPC port (6334) when the URL carries no explicit port.
qdrant.enabled=${QDRANT_ENABLED:false}
qdrant.url=${QDRANT_URL:}
qdrant.api-key=${QDRANT_API_KEY:}

# Structured logging
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${OBSERVABILITY_SERVICE_NAME:${spring.application.name}}
logging.structured.ecs.service.environment=${OBSERVABILITY_ENVIRONMENT:local}


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,profile,email}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
spring.security.oauth2.client.provider.google.token-uri=${GOOGLE_TOKEN_URI:https://www.googleapis.com/oauth2/v4/token}
spring.security.oauth2.client.provider.google.user-info-uri=${GOOGLE_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
spring.security.oauth2.client.provider.google.user-name-attribute=${GOOGLE_USER_NAME_ATTRIBUTE:email}


spring.config.import=optional:file:.env.local.properties

# Application URLs
FRONTEND_URL=${FRONTEND_URL:https://www.outreach-ly.com}

# Session configuration
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# OpenAI Configuration (embeddings only)
OPENAI_API_KEY=${OPENAI_API_KEY:sk-dummy-key}

# Anthropic Configuration (chat, scoring, evals)
ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:sk-ant-dummy-key}

# Integration OAuth - GitHub
github.app-id=${GITHUB_APP_ID:}
github.app-install-url=${GITHUB_APP_INSTALL_URL:}
github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}

# Integration OAuth - Slack
slack.client-id=${SLACK_CLIENT_ID:}
slack.client-secret=${SLACK_CLIENT_SECRET:}
slack.redirect-uri=${SLACK_REDIRECT_URI:http://localhost:8080/api/integrations/slack/callback}
slack.signing-secret=${SLACK_SIGNING_SECRET:}

# Integration OAuth - Linear
linear.client-id=${LINEAR_CLIENT_ID:}
linear.client-secret=${LINEAR_CLIENT_SECRET:}
linear.redirect-uri=${LINEAR_REDIRECT_URI:http://localhost:8080/api/integrations/linear/callback}
linear.webhook-secret=${LINEAR_WEBHOOK_SECRET:}

# Integration frontend redirect
integrations.frontend-url=${INTEGRATIONS_FRONTEND_URL:http://localhost:3000}

management.opentelemetry.resource-attributes[service.name]=${OBSERVABILITY_SERVICE_NAME:${spring.application.name}}
management.opentelemetry.resource-attributes[service.namespace]=${OBSERVABILITY_SERVICE_NAMESPACE:pulse}
management.opentelemetry.resource-attributes[deployment.environment]=${OBSERVABILITY_ENVIRONMENT:local}

# Rate limiting
pulse.rate-limit.general.requests-per-minute=${RATE_LIMIT_GENERAL:60}
pulse.rate-limit.ai.requests-per-minute=${RATE_LIMIT_AI:10}

# File upload limits (for resume PDF)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
logging.level.com.pulse.pulse.service.integration=DEBUG
