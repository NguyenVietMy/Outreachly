services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env.local.properties

  agent:
    build: ./agent
    ports:
      - "8001:8001"
    env_file:
      - ./agent/.env
    environment:
      # Reach the API over the compose network, not localhost.
      PULSE_API_URL: http://api:8080
    depends_on:
      - api
